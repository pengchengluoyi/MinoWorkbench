name: Release native production
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: windows-latest
            platform: win32-x64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: python -m pip install pyinstaller certifi
      - name: Validate source version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os; assert os.environ['GITHUB_REF_NAME'] == 'v' + __import__('json').loads(__import__('pathlib').Path('package.json').read_text())['version']"
      - name: Validate repository installer
        run: |
          bash -n packaging/bootstrap.sh
          bash -n packaging/install.sh
      - name: Validate Windows installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('packaging/install.ps1', 'packaging/bootstrap.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - run: python scripts/build_release.py --output dist
      - name: Create install manifest for the exact build
        run: |
          VERSION=$(python -c "from pathlib import Path; import json; print(Path('mino_nexus/VERSION').read_text().strip() if Path('mino_nexus').is_dir() else json.loads(Path('package.json').read_text())['version'])")
          python scripts/write_manifest.py --dist dist --prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION"
      - name: Install the released Nexus integration partner
        run: python packaging/install.py --components nexus --nexus-version 0.1.43 --root "$RUNNER_TEMP/mino-install/nexus" --command-dir "$RUNNER_TEMP/mino-commands" --no-path
      - name: Validate installer against the actual native package
        run: |
          python - <<'PYCODE'
          import os, pathlib, subprocess
          installer = next(p for p in pathlib.Path('dist').glob('MinoInstaller-*') if p.is_file())
          receiver = pathlib.Path(os.environ['RUNNER_TEMP'])/'install-browser-receiver.py'
          receiver.write_text('import pathlib,sys; pathlib.Path(__file__).with_suffix(".url").write_text(sys.argv[1])')
          browser_env = dict(os.environ, BROWSER=f'"{__import__("sys").executable}" "{receiver}" %s')
          subprocess.run([str(installer.resolve()), '--components', 'workbench', '--package-dir', str(pathlib.Path('dist').resolve()), '--root', str(pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-install'/'workbench'), '--command-dir', str(pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-commands'), '--no-path'], env=browser_env, check=True)
          assert receiver.with_suffix('.url').read_text() == 'http://127.0.0.1:60104'
          PYCODE
      - name: Verify native pair in a cold browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'PYCODE'
          import json, os, sys
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, str(Path('packaging').resolve()))
          from mino_release import read
          from mino_update_service import api_compatibility
          root = Path(os.environ['RUNNER_TEMP'])/'mino-install/workbench'
          from mino_platform import current_release
          release = current_release(root)
          info = read(release/'release.json')
          evidence = api_compatibility(read(root/'config/installation.json'), info)
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as probe:
              probe.connect(('8.8.8.8', 80))
              lan = probe.getsockname()[0]
          failures = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(service_workers='block')
              def route(r):
                  if urlsplit(r.request.url).hostname not in ('127.0.0.1', 'localhost', lan):
                      failures.append('unexpected remote resource'); r.abort()
                  else: r.continue_()
              context.route('**/*', route)
              requests = []
              page = context.new_page()
              page.on('request', lambda r: requests.append(r.url))
              page.on('pageerror', lambda e: failures.append(str(e)))
              page.on('requestfailed', lambda r: failures.append(r.url))
              page.goto(f'http://{lan}:60104/login', wait_until='networkidle')
              assert page.locator('#root').inner_text().strip()
              assert page.evaluate('window.__MINO_CONFIG__.nexusUrl') == 'http://127.0.0.1:50104'
              target = page.evaluate("""async () => {
                  const response = await fetch('/runtime-config.js');
                  if (!response.ok) throw new Error('runtime configuration missing');
                  return window.__MINO_CONFIG__.nexusUrl;
              }""")
              assert target == 'http://127.0.0.1:50104'
              page.get_by_placeholder('邮箱或用户名').fill('native-ci-nonexistent-account')
              page.get_by_placeholder('密码', exact=True).fill('native-ci-invalid-password')
              with page.expect_response(lambda r: r.url.startswith(f'http://{lan}:50104/auth/')) as login_response:
                  page.locator('button[type=submit]').click()
              assert login_response.value.status < 500, login_response.value.status
              page.get_by_role('alert').wait_for()
              assert any(f'http://{lan}:50104/' in r for r in requests), requests
              page.get_by_role('link', name='注册账号').click()
              page.wait_for_url('**/register')
              web = release/'_internal/web'
              assets = ['/releases/'+info['build_id']+'/'+f.relative_to(web).as_posix() for f in web.rglob('*') if f.is_file() and f.name != 'index.html']
              page.evaluate("""async paths => {
                  for (const path of paths) {
                      const res = await fetch(path, {cache:'no-store'});
                      if (!res.ok) throw new Error(path);
                      if (path.endsWith('.js')) await import(path);
                      else if (path.endsWith('.css')) { const sheet=new CSSStyleSheet(); sheet.replaceSync(await res.text()); }
                      else await res.arrayBuffer();
                  }
              }""", assets)
              assert not failures, failures
              browser.close()
          print(json.dumps({'native_pair': evidence, 'cold_browser_assets':len(assets), 'passed':True}))
          PYCODE
      - name: Verify native stop and restart
        run: |
          python - <<'PYCODE'
          import json, os, pathlib, subprocess, time, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-install'/'workbench'
          helper = root/'launcher'/('mino-maintain.exe' if os.name == 'nt' else 'mino-maintain')
          entry = pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-commands'/('mino-workbench'+('.cmd' if os.name=='nt' else ''))
          command = ['cmd', '/c', str(entry)] if os.name=='nt' else [str(entry)]
          for action in ('stop','stop','start','start'):
              subprocess.run(command + [action], check=True)
              status = json.loads(subprocess.check_output(command + ['status'], text=True))
              assert status['running'] == (action == 'start'), status
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(60):
              try:
                  with opener.open('http://127.0.0.1:60104/health', timeout=2) as response: result = json.load(response)
                  assert result.get('data',result)['build_id'] == json.loads(pathlib.Path('dist/manifest.json').read_text())['build_id']
                  break
              except OSError:
                  if attempt == 59: raise
                  time.sleep(1)
          url = subprocess.check_output(command + ['open', '--print-url'], text=True).strip()
          assert url == 'http://127.0.0.1:60104', url
          assert 'open' in subprocess.check_output(command + ['--help'], text=True)
          subprocess.run(command + ['stop'], check=True)
          # Exercise browser dispatch without requiring an interactive desktop on CI.
          receiver = pathlib.Path(os.environ['RUNNER_TEMP'])/'browser-receiver.py'
          receipt = receiver.with_suffix('.url')
          receiver.write_text('import pathlib,sys; pathlib.Path(__file__).with_suffix(".url").write_text(sys.argv[1])')
          browser_env = dict(os.environ, BROWSER=f'"{__import__("sys").executable}" "{receiver}" %s')
          subprocess.run(command + ['open'], env=browser_env, check=True)
          assert receipt.read_text() == url
          assert json.loads(subprocess.check_output(command + ['status'], text=True))['running']
          subprocess.run(command + ['stop'], check=True)
          PYCODE
      - uses: actions/upload-artifact@v5
        with:
          name: native-package-${{ matrix.platform }}
          path: |
            dist/Mino*.zip
            dist/item-*.json
            dist/MinoInstaller-*
            dist/installer-*.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          pattern: native-package-*
          merge-multiple: true
          path: dist
      - name: Validate packages and create manifest
        env:
          RELEASE_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: python scripts/write_manifest.py --dist dist --prefix "$RELEASE_PREFIX"
      - name: Require every native platform and assemble installer checksums
        run: |
          python - <<'PYCODE'
          import json, pathlib, shutil
          root = pathlib.Path('dist')
          expected = {('linux','x64'), ('win32','x64'), ('darwin','arm64'), ('darwin','x64')}
          items = json.loads((root/'manifest.json').read_text())['items']
          assert {(x['os'],x['arch']) for x in items} == expected
          hashes = sorted(root.glob('installer-*.sha256'))
          assert len(hashes) == 4
          (root/'INSTALLER-SHA256SUMS.txt').write_text(''.join(p.read_text() for p in hashes))
          for name in ('install.sh','install.ps1','bootstrap.sh','bootstrap.ps1'):
              shutil.copyfile(pathlib.Path('packaging')/name, root/name)
          PYCODE
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Mino*.zip
            dist/manifest.json
            dist/bootstrap.sh
            dist/bootstrap.ps1
            dist/install.sh
            dist/install.ps1
            dist/MinoInstaller-*
            dist/INSTALLER-SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
