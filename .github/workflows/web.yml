name: Workbench static web
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -- --base ./
      - run: node scripts/build-web.mjs
      - name: Archive
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('dist/BUILD.json')).version")
          tar -czf "workbench-web-${version}.tar.gz" -C dist .
          sha256sum workbench-web-*.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-web
          path: |
            workbench-web-*.tar.gz
            SHA256SUMS.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: web
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workbench-web
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            workbench-web-*.tar.gz
            SHA256SUMS.txt
          fail_on_unmatched_files: true
